<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Photo Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html,body,#root{height:100%;margin:0;background:#121212;color:#E5E5E5;overflow:hidden;font-family:Inter,sans-serif}
  .slider-input{-webkit-appearance:none;appearance:none;outline:none;background:#2E2E2E;height:4px;border-radius:2px}
  .slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #3B82F6;cursor:pointer}
  .no-scrollbar::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect,useCallback}=React;

// ---- WebGL Vertex Shader ----
const VERT=`attribute vec2 a; varying vec2 uv; void main(){uv=a*0.5+0.5; uv.y=1.0-uv.y; gl_Position=vec4(a,0.0,1.0);}`;

// ---- WebGL Fragment Shader ----
const FRAG=`
precision highp float;
varying vec2 uv;
uniform sampler2D img;
uniform float exposure,contrast,highlights,shadows,temperature,saturation;
uniform float blackPoint,whitePoint,gamma;
uniform sampler2D lutTex;
uniform bool useCurve;
uniform vec3 shadowColor,midColor,highlightColor;
uniform float shadowAmount,midAmount,highlightAmount,balance;
uniform float hslHue[6];
uniform float hslSat[6];
uniform float hslLum[6];

float luma(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}

vec3 rgb2hsl(vec3 c){
  float mx=max(max(c.r,c.g),c.b),mn=min(min(c.r,c.g),c.b);
  float l=(mx+mn)*0.5,d=mx-mn;float h=0.0,s=0.0;
  if(d>1e-5){
    s=l>0.5?d/(2.0-mx-mn):d/(mx+mn);
    if(mx==c.r)h=(c.g-c.b)/d+(c.g<c.b?6.0:0.0);
    else if(mx==c.g)h=(c.b-c.r)/d+2.0;else h=(c.r-c.g)/d+4.0;
    h/=6.0;
  }
  return vec3(h,s,l);
}
float h2r(float p,float q,float t){
  if(t<0.0)t+=1.0;if(t>1.0)t-=1.0;
  if(t<1.0/6.0)return p+(q-p)*6.0*t;
  if(t<0.5)return q;
  if(t<2.0/3.0)return p+(q-p)*(2.0/3.0-t)*6.0;
  return p;
}
vec3 hsl2rgb(vec3 h){
  float s=h.y,l=h.z;
  if(s<1e-5)return vec3(l);
  float q=l<0.5?l*(1.0+s):l+s-l*s;
  float p=2.0*l-q;
  return vec3(h2r(p,q,h.x+1.0/3.0),h2r(p,q,h.x),h2r(p,q,h.x-1.0/3.0));
}
const float BH[6]=float[6](0.0,30.0,60.0,120.0,240.0,280.0);
float bW(float hue,float b){float d=abs(hue-b);d=min(d,360.0-d);return smoothstep(60.0,0.0,d);}

void main(){
  vec4 src=texture2D(img,uv);
  vec3 c=src.rgb;
  c*=pow(2.0,exposure);
  c.r*=1.0+temperature*0.15;
  c.b*=1.0-temperature*0.15;
  c=(c-0.5)*(1.0+contrast)+0.5;
  float l=luma(c);
  c+=shadows*smoothstep(0.5,0.0,l)*0.5;
  c+=highlights*smoothstep(0.5,1.0,l)*0.5;
  float lum=luma(c);
  c=mix(vec3(lum),c,1.0+saturation);
  float bp=blackPoint/255.0,wp=whitePoint/255.0;
  c=clamp((c-bp)/max(wp-bp,1e-4),0.0,1.0);
  c=pow(c,vec3(1.0/max(gamma,1e-3)));
  if(useCurve){
    vec3 idx=floor(clamp(c,0.0,1.0)*255.0);
    float xR=mod(idx.r,64.0),yR=floor(idx.r/64.0);
    float xG=mod(idx.g,64.0),yG=floor(idx.g/64.0);
    float xB=mod(idx.b,64.0),yB=floor(idx.b/64.0);
    float tx=1.0/64.0,ty=1.0/4.0;
    vec3 lut;
    lut.r=texture2D(lutTex,vec2((xR+0.5)*tx,(yR+0.5)*ty)).r;
    lut.g=texture2D(lutTex,vec2((xG+0.5)*tx,(yG+0.5)*ty)).g;
    lut.b=texture2D(lutTex,vec2((xB+0.5)*tx,(yB+0.5)*ty)).b;
    c=lut;
  }
  vec3 hsl=rgb2hsl(clamp(c,0.0,1.0));
  float hd=hsl.x*360.0;
  float dH=0.0,sM=1.0,dL=0.0;
  for(int i=0;i<6;i++){
    float w=bW(hd,BH[i]);
    if(w>0.001){dH+=hslHue[i]*w;sM*=(1.0+hslSat[i]*w);dL+=hslLum[i]*w;}
  }
  hsl.x=fract(hsl.x+dH/360.0);
  hsl.y=clamp(hsl.y*sM,0.0,1.0);
  hsl.z=clamp(hsl.z+dL*0.5,0.0,1.0);
  c=hsl2rgb(hsl);
  float l2=luma(c);
  float shM=smoothstep(balance+0.15,balance-0.15,l2);
  float hiM=smoothstep(balance-0.15,balance+0.15,l2);
  float miM=1.0-shM-hiM;
  c=mix(c,shadowColor,shM*shadowAmount);
  c=mix(c,highlightColor,hiM*highlightAmount);
  c=mix(c,midColor,miM*midAmount);
  gl_FragColor=vec4(clamp(c,0.0,1.0),src.a);
}`;
